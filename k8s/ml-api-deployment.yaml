apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
  labels:
    app: ml-api
    tier: application
    version: v1
spec:
  replicas: 2  # Начинаем с 2 реплик
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Можем создать 1 дополнительный под при обновлении
      maxUnavailable: 0  # Все поды должны быть доступны во время обновления
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
        tier: application
        version: v1
    spec:
      containers:
      - name: ml-api
        image: YOUR_USERNAME/ml-api:v1  # ЗАМЕНИТЕ на свой образ!
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "mldb"
        - name: POSTGRES_USER
          value: "mluser"
        - name: POSTGRES_PASSWORD
          value: "mlpassword"
        - name: MODEL_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Startup Probe - для медленного старта (загрузка модели)
        startupProbe:
          httpGet:
            path: /startup
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 24  # 24 * 5 = 120 секунд на старт
        # Liveness Probe - проверяет, что контейнер жив
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Readiness Probe - проверяет готовность принимать трафик
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ml-api
  labels:
    app: ml-api
spec:
  type: NodePort  # Используем NodePort для доступа из Minikube
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
    nodePort: 30080  # Фиксированный порт для удобства
  selector:
    app: ml-api
